name: Feature Request
description: Suggest a change to an existing overlay.
title: "[FR]: "
labels: ["enhancement"]
assignees:
  - akuqt
body:
  - type: input
    id: overlay
    attributes:
      label: Overlay
      description: Its name, as shown in Tokio's gallery. For a new overlay, use the Overlay Request form.
      placeholder: Likes Counter
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is.
      placeholder: Ex. I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: Ex. I want to [...]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
      placeholder: Ex. I have considered [...]
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false
