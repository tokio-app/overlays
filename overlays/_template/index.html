<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overlay Template</title>
    <!-- Tokio rewrites this block with the overlay's ID and saved settings. Keep it exactly
         like this, before the scripts that read it, with the defaults from config.yaml. -->
    <script id="tokio-setup">
      window.__OVERLAY_ID__ = "";
      window.__OVERLAY_CONFIG__ = { title: "Likes", main_color: "#ffffff" };
    </script>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <h1 id="title">Likes</h1>
    <p id="likes">0</p>
  </body>
</html>
