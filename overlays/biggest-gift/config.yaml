# The settings streamers see in Tokio's gallery. Each field's id is a key of
# window.__OVERLAY_CONFIG__. Keep the defaults in index.html's setup block in sync.
# Field and option ids are kept across updates, so don't rename them.
sections:
  - name: Gift
    id: gift
    translations: { es: Regalo }
  - name: Look
    id: look
    translations: { es: Aspecto }
  - name: Animations
    id: animations
    translations: { es: Animaciones }
  - name: Colors
    id: colors
    translations: { es: Colores }
fields:
  - name: When it shows
    id: visibility
    type: dropdown
    section: gift
    translations: { es: Cuándo aparece }
    attributes:
      multiple: false
      value: always
      default: always
      options:
        - value: always
          label: All the time
          translations: { es: Todo el tiempo }
        - value: after_gift
          label: For a few seconds when it changes
          translations: { es: Unos segundos cuando cambia }
  - name: Seconds it stays after it changes
    id: seconds
    type: slider
    section: gift
    when: { visibility: after_gift }
    translations: { es: Segundos que se queda después de cambiar }
    attributes:
      min: 3
      max: 60
      value: 10
      default: 10
  - name: Clear the biggest gift after this many hours without gifts
    id: clear_hours
    type: slider
    section: gift
    translations: { es: Horas sin regalos para quitar el regalo más grande }
    attributes:
      min: 1
      max: 24
      value: 6
      default: 6
  - name: Title (empty hides it)
    id: title
    type: input
    section: gift
    translations: { es: Título (vacío lo oculta) }
    attributes:
      mode: text
      placeholder: Biggest gift
      translations: { es: Regalo más grande }
      value: Biggest gift
      default: Biggest gift
  - name: Show the gifter's photo
    id: show_photo
    type: toggle
    section: gift
    translations: { es: Mostrar la foto de quien regala }
    attributes:
      value: true
      default: true
  - name: Show the combo count (×5)
    id: show_combo
    type: toggle
    section: gift
    translations: { es: Mostrar el combo (×5) }
    attributes:
      value: true
      default: true
  - name: Show the coins
    id: show_coins
    type: toggle
    section: gift
    translations: { es: Mostrar las monedas }
    attributes:
      value: true
      default: true
  - name: Layout
    id: layout
    type: dropdown
    section: look
    translations: { es: Diseño }
    attributes:
      multiple: false
      value: stacked
      default: stacked
      options:
        - value: stacked
          label: Stacked
          translations: { es: Apilado }
        - value: row
          label: In a row
          translations: { es: En fila }
  - name: Alignment
    id: align
    type: dropdown
    section: look
    translations: { es: Alineación }
    attributes:
      multiple: false
      value: center
      default: center
      options:
        - value: left
          label: Left
          translations: { es: Izquierda }
        - value: center
          label: Center
          translations: { es: Centro }
        - value: right
          label: Right
          translations: { es: Derecha }
  - name: Font
    id: font
    type: font
    section: look
    translations: { es: Fuente }
    attributes:
      value: ""
      default: ""
  - name: Size (%)
    id: size
    type: slider
    section: look
    translations: { es: Tamaño (%) }
    attributes:
      min: 50
      max: 200
      value: 100
      default: 100
  - name: How a new gift comes in
    id: entrance
    type: dropdown
    section: animations
    translations: { es: Cómo entra un regalo nuevo }
    attributes:
      multiple: false
      value: pop
      default: pop
      options:
        - value: pop
          label: Pop
          translations: { es: Aparición }
        - value: drop
          label: Drop
          translations: { es: Caída }
        - value: spin
          label: Spin
          translations: { es: Giro }
        - value: slide
          label: Slide
          translations: { es: Deslizar }
        - value: fade
          label: Fade
          translations: { es: Fundido }
  - name: Light behind the gift
    id: light
    type: dropdown
    section: animations
    translations: { es: Luz detrás del regalo }
    attributes:
      multiple: false
      value: rays
      default: rays
      options:
        - value: rays
          label: Rays
          translations: { es: Rayos }
        - value: sunburst
          label: Sunburst
          translations: { es: Sol radiante }
        - value: spiral
          label: Spiral
          translations: { es: Espiral }
        - value: spotlights
          label: Spotlights
          translations: { es: Reflectores }
        - value: burst
          label: Comic burst
          translations: { es: Estallido de cómic }
        - value: ripples
          label: Ripples
          translations: { es: Ondas }
        - value: star
          label: Star
          translations: { es: Estrella }
        - value: hearts
          label: Hearts
          translations: { es: Corazones }
        - value: glow
          label: Glow
          translations: { es: Resplandor }
        - value: none
          label: None
          translations: { es: Ninguna }
  - name: Let the light move
    id: light_moves
    type: toggle
    section: animations
    when: { light: { not: none } }
    translations: { es: Mover la luz }
    attributes:
      value: true
      default: true
  - name: Let the gift float
    id: float
    type: toggle
    section: animations
    translations: { es: Hacer flotar el regalo }
    attributes:
      value: true
      default: true
  - name: Show sparkles when a gift comes in
    id: sparkles
    type: toggle
    section: animations
    translations: { es: Mostrar destellos cuando entra un regalo }
    attributes:
      value: true
      default: true
  - name: Main color
    id: main_color
    type: color
    section: colors
    translations: { es: Color principal }
    attributes:
      value: f43f5e
      default: f43f5e
  - name: Light
    id: light_color
    type: color
    section: colors
    translations: { es: Luz }
    attributes:
      value: f43f5e
      default: f43f5e
  - name: Name
    id: name_color
    type: color
    section: colors
    translations: { es: Nombre }
    attributes:
      value: f1f5f9
      default: f1f5f9
  - name: Coins
    id: coin_color
    type: color
    section: colors
    translations: { es: Monedas }
    attributes:
      value: ffc93c
      default: ffc93c
  - name: Outline
    id: outline_color
    type: color
    section: colors
    translations: { es: Contorno }
    attributes:
      value: "18181b"
      default: "18181b"
