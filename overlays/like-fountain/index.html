<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Like Fountain</title>
    <!-- Tokio rewrites this block with the overlay's ID and saved settings. Keep it exactly
         like this, before the scripts that read it, with the defaults from config.yaml. -->
    <script id="tokio-setup">
      window.__OVERLAY_ID__ = "";
      window.__OVERLAY_CONFIG__ = {
        origin: "middle",
        heart_size: 48,
        show_pictures: true,
        heart_color: "#ff1f2f",
        second_color: "#22e632",
      };
    </script>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <canvas id="fountain" aria-hidden="true"></canvas>
  </body>
</html>
