# The settings streamers see in Tokio's gallery. Each field's id is a key of
# window.__OVERLAY_CONFIG__. Keep the defaults in index.html's setup block in sync.
# Field and option ids are kept across updates, so don't rename them.
sections:
  - name: Songs
    id: songs
    translations: { es: Canciones }
  - name: Look
    id: look
    translations: { es: Aspecto }
  - name: Animations
    id: animations
    translations: { es: Animaciones }
  - name: Colors
    id: colors
    translations: { es: Colores }
fields:
  - name: Songs up next
    id: next_count
    type: slider
    section: songs
    translations: { es: Siguientes canciones }
    attributes:
      min: 0
      max: 5
      value: 2
      default: 2
  - name: How Up next looks
    id: next_style
    type: dropdown
    section: songs
    when: { next_count: { not: 0 } }
    translations: { es: Cómo se ven las siguientes canciones }
    attributes:
      multiple: false
      value: list
      default: list
      options:
        - value: list
          label: List
          translations: { es: Lista }
        - value: covers
          label: List with covers
          translations: { es: Lista con portadas }
        - value: discs
          label: Covers only
          translations: { es: Solo portadas }
        - value: ticker
          label: Ticker
          translations: { es: Marquesina }
        - value: inside
          label: Inside the card
          translations: { es: Dentro de la tarjeta }
  - name: Text before the next songs
    id: next_label
    type: input
    section: songs
    when: { next_count: { not: 0 } }
    translations: { es: Texto antes de las siguientes canciones }
    attributes:
      mode: text
      placeholder: Up next
      translations: { es: A continuación }
      value: Up next
      default: Up next
  - name: Layout
    id: layout
    type: dropdown
    section: look
    translations: { es: Diseño }
    attributes:
      multiple: false
      value: pill
      default: pill
      options:
        - value: pill
          label: Pill with a disc
          translations: { es: Cápsula con disco }
        - value: sleeve
          label: Record sleeve
          translations: { es: Funda de disco }
        - value: big
          label: Big cover
          translations: { es: Portada grande }
        - value: bar
          label: Slim bar
          translations: { es: Barra delgada }
        - value: text
          label: Text only
          translations: { es: Solo texto }
  - name: Alignment
    id: align
    type: dropdown
    section: look
    translations: { es: Alineación }
    attributes:
      multiple: false
      value: left
      default: left
      options:
        - value: left
          label: Left
          translations: { es: Izquierda }
        - value: center
          label: Center
          translations: { es: Centro }
        - value: right
          label: Right
          translations: { es: Derecha }
  - name: Font
    id: font
    type: font
    section: look
    translations: { es: Fuente }
    attributes:
      value: ""
      default: ""
  - name: Size (%)
    id: size
    type: slider
    section: look
    translations: { es: Tamaño (%) }
    attributes:
      min: 50
      max: 200
      value: 100
      default: 100
  - name: How the card comes in
    id: entrance
    type: dropdown
    section: animations
    translations: { es: Cómo entra la tarjeta }
    attributes:
      multiple: false
      value: slide
      default: slide
      options:
        - value: slide
          label: Slide
          translations: { es: Deslizar }
        - value: fade
          label: Fade
          translations: { es: Fundido }
        - value: pop
          label: Pop
          translations: { es: Aparición }
        - value: drop
          label: Drop
          translations: { es: Caída }
        - value: flip
          label: Flip
          translations: { es: Volteo }
        - value: wipe
          label: Wipe
          translations: { es: Barrido }
  - name: Turn the cover while a song plays
    id: spin
    type: toggle
    section: animations
    when: { layout: [pill, sleeve, bar] }
    translations: { es: Girar la portada mientras suena una canción }
    attributes:
      value: true
      default: true
  - name: Card
    id: card_color
    type: color
    section: colors
    translations: { es: Tarjeta }
    attributes:
      value: "18181b"
      default: "18181b"
  - name: Text
    id: text_color
    type: color
    section: colors
    translations: { es: Texto }
    attributes:
      value: f1f5f9
      default: f1f5f9
  - name: Accent
    id: accent_color
    type: color
    section: colors
    translations: { es: Destacado }
    attributes:
      value: f43f5e
      default: f43f5e
