# The settings streamers see in Tokio's gallery. Each field's id is a key of
# window.__OVERLAY_CONFIG__. Keep the defaults in index.html's setup block in sync.
sections:
  - name: Ranking
    id: ranking
  - name: Total likes
    id: total
    translations: { es: Total de Me gusta }
  - name: Colors
    id: colors
    translations: { es: Colores }
fields:
  - name: Viewers shown
    id: max_users
    type: slider
    section: ranking
    translations: { es: Espectadores que se muestran }
    attributes:
      min: 3
      max: 20
      value: 3
      default: 3
  - name: Crown on the top viewer
    id: show_crown
    type: toggle
    section: ranking
    translations: { es: Corona en el primer lugar }
    attributes:
      value: true
      default: true
  - name: Start over after this many hours without likes
    id: reset_hours
    type: slider
    section: ranking
    translations: { es: Horas sin Me gusta para empezar de nuevo }
    attributes:
      min: 1
      max: 24
      value: 6
      default: 6
  - name: Show the LIVE's total likes
    id: show_total
    type: toggle
    section: total
    translations: { es: Mostrar el total de Me gusta del LIVE }
    attributes:
      value: true
      default: true
  - name: Label
    id: total_label
    type: input
    section: total
    when: { show_total: true }
    translations: { es: Etiqueta }
    attributes:
      mode: text
      placeholder: likes
      translations: { es: Me gusta }
      value: likes
      default: likes
  - name: Names
    id: name_color
    type: color
    section: colors
    translations: { es: Nombres }
    attributes:
      value: 3b9ae1
      default: 3b9ae1
  - name: Likes and ranks
    id: count_color
    type: color
    section: colors
    translations: { es: Me gusta y posiciones }
    attributes:
      value: e6e6e6
      default: e6e6e6
  - name: Hearts
    id: heart_color
    type: color
    section: colors
    translations: { es: Corazones }
    attributes:
      value: e8222b
      default: e8222b
